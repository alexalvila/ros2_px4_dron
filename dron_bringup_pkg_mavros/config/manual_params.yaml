keyboard_node_mavros:
  ros__parameters:
    publish_hz: 30.0
    linear_speed: 0.75
    vertical_speed: 0.35
    boost_linear_speed: 1.25
    boost_vertical_speed: 0.60
    key_timeout_s: 0.20
    linear_incremental: 1.0
    vertical_incremental: 1.0
    yaw_incremental: 1.0

manual_control_node_mavros:
  ros__parameters:
    loop_hz: 30.0
    takeoff_altitude_m: 2.0
    takeoff_acceptance_m: 0.25
    require_safety_enable: true
    auto_arm_on_takeoff: false
    max_xy_speed: 1.0
    max_z_speed: 0.5
    max_yaw_rate: 0.6
    max_xy_accel: 0.6
    max_z_accel: 0.35
    max_yaw_accel: 1.0
    max_xy_decel: 1.2
    max_z_decel: 0.8
    max_yaw_decel: 1.5
    manual_deadman_timeout_s: 0.30
    offboard_warmup_cycles: 30
    auto_arm_delay_cycles: 10

telemetry_node_mavros:
  ros__parameters:
    publish_hz: 5.0

manual_safety_node_mavros:
  ros__parameters:
    publish_hz: 10.0
    min_battery_remaining: 0.25
    block_if_landed: false
    require_mavros_connected: true

tf_odometry_node_mavros:
  ros__parameters:
    odom_topic: "/mavros/local_position/odom"
    odom_msg_topic: "/odom"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    publish_map_to_odom: true
    publish_odom_msg: true
